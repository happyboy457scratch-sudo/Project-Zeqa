<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milkyclan Cosmetics Vault</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }

        .stats {
            color: #94a3b8;
            font-size: 1rem;
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Card Styling */
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #334155;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        .img-container {
            width: 100%;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0f172a;
            border-radius: 8px;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .img-container img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 0.5rem;
            color: #f1f5f9;
        }

        .details {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        /* Rarity Badges */
        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .rarity-common { background-color: #64748b; color: #fff; }
        .rarity-rare { background-color: #2563eb; color: #fff; }
        .rarity-epic { background-color: #9333ea; color: #fff; }
        .rarity-legendary { background-color: #eab308; color: #000; }
        .rarity-limited { background-color: #ef4444; color: #fff; }
        .rarity-exotic { background-color: #06b6d4; color: #fff; }
        .rarity-partner { background-color: #10b981; color: #fff; }

        .category {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        /* Loading / Error Messages */
        #status-msg {
            text-align: center;
            font-size: 1.2rem;
            color: #94a3b8;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cosmetics Vault</h1>
        <div class="stats" id="item-count">Loading cosmetics...</div>
    </header>

    <div id="status-msg">Fetching cosmetics from data...</div>
    <div class="grid" id="cosmetics-grid"></div>

    <script>
        // Fetch the cosmetics JSON generated by your scraper workflow
        fetch('./data/cosmetics.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Could not find data/cosmetics.json file.');
                }
                return response.json();
            })
            .then(data => {
                const grid = document.getElementById('cosmetics-grid');
                const statusMsg = document.getElementById('status-msg');
                const itemCount = document.getElementById('item-count');

                statusMsg.style.display = 'none';
                itemCount.innerText = `Total Cosmetics Loaded: ${data.length}`;

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    const rarityClass = `rarity-${(item.rarity || 'common').toLowerCase()}`;
                    const imgUrl = item.imageUrl || 'https://via.placeholder.com/150?text=No+Image';

                    card.innerHTML = `
                        <div class="img-container">
                            <img src="${imgUrl}" alt="${item.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=No+Image';">
                        </div>
                        <div class="card-title">${item.name}</div>
                        <div class="details">
                            <span class="badge ${rarityClass}">${item.rarity}</span>
                            <span class="category">${item.category}</span>
                        </div>
                    `;

                    grid.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('status-msg').innerText = 'Error loading cosmetics data: ' + err.message;
            });
    </script>
</body>
</html>
