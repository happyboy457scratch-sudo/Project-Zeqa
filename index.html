<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Zeqa - Home</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }

    .navbar {
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #38bdf8;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #f8fafc;
    }

    .nav-links a.active {
      color: #38bdf8;
      border-bottom: 2px solid #38bdf8;
      padding-bottom: 4px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 48px 20px;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      color: #facc15;
      margin-bottom: 12px;
    }

    p {
      color: #94a3b8;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-logo">Project Zeqa</a>
    <div class="nav-links">
      <a href="index.html" class="active">Home</a>
      <a href="trades.html">Live Trade Tracker</a>
    </div>
  </nav>

  <div class="container">
    <h1>Welcome to Project Zeqa</h1>
    <p>Use the navigation bar above to view the Live Trade Tracker.</p>
  </div>

</body>
</html>
