name: Manual Scrape Trigger

# Runs only when you click "Run workflow" in GitHub Actions UI
on:
  workflow_dispatch:

jobs:
  run-manual-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Cosmetic Scraper
        run: python scripts/scrape_all_cosmetics.py

      - name: Commit Updated Graph Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff-index --quiet HEAD || git commit -m "manual: update cosmetic graphs data"
          git push
