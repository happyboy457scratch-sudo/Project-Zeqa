name: Manual Scrape Trigger

on:
  workflow_dispatch:

jobs:
  run-manual-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Enables git push permissions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright Chromium
        run: |
          pip install playwright beautifulsoup4
          playwright install --with-deps chromium

      - name: Run Playwright Scraper Script
        run: python scripts/scrape_all_cosmetics.py

      - name: Commit Updated Graph Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff-index --quiet HEAD || git commit -m "manual: update cosmetic trades data"
          git push
