name: Auto Scrape Milkyclan Vault

on:
  schedule:
    # Runs automatically every day at midnight UTC
    - cron: '0 0 * * *'
  # Allows you to manually trigger the workflow from the GitHub Actions tab anytime
  workflow_dispatch:

# Give the workflow read & write permissions to push file updates back to the repo
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.10 environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install Playwright and browser dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      # Step 4: Run the Python scraper script
      - name: Run Scraper Script
        run: python scripts/scraper.py

      # Step 5: Commit and Push the updated data/cosmetics.json file
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cosmetics.json
          git commit -m "Auto-update cosmetics dataset [clean overwrite]" || echo "No changes detected"
          git push
